upstream backend {
    server backend:8000;
    keepalive 32;
}

client_max_body_size 20M;

server {
    listen 80;
    server_name _;

    # ── Gzip ────────────────────────────────────────────────────────────────
    gzip on;
    gzip_types text/html text/css application/javascript application/json;
    gzip_min_length 1024;

    # ── API y endpoints sueltos (ANTES del location /) ──────────────────────
    location /api/ {
        proxy_pass         http://backend/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_redirect     off;

        proxy_connect_timeout 10s;
        proxy_read_timeout    120s;
        proxy_send_timeout    120s;

        add_header X-Frame-Options        SAMEORIGIN;
        add_header X-Content-Type-Options  nosniff;
    }

    # Parche temporal: endpoints sin /api/ (BORRAR cuando corrijas el frontend)
    location ~ ^/(locales|categorias|productos|generales|me|usuarios)(/|$) {
        proxy_pass         http://backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header   Host            $host;
        proxy_set_header   X-Real-IP       $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   Connection      "";
        proxy_redirect     off;
    }

    # ── Static assets (cache agresivo) ──────────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        root /usr/share/nginx/html;
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── HTML principal (sin cache) ──────────────────────────────────────────
    location = /dashboard4.html {
        root /usr/share/nginx/html;
        expires -1;
        add_header Cache-Control "no-store";
    }

    # ── Health check ────────────────────────────────────────────────────────
    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # ── SPA fallback (debe ir al FINAL) ─────────────────────────────────────
    location / {
        root /usr/share/nginx/html;
        index dashboard4.html;
        try_files $uri $uri/ /dashboard4.html;
    }

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;
}